name: Smoke test

# starts MPS via generated environments on every OS: the only check that the start scripts and the prepared MPS
# really run (unit tests use fake launchers); see smoke-test/smoke.sh and smoke-test/smoke.ps1
on:
  push:
    branches:
      - 'main'
  pull_request: {}
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

# MPS downloads live in the workspace (mps-cache/downloads, Maven layout as the CLI keeps it), so the cache paths are
# the same string on every OS: a cache entry only matches the exact path it was saved with
env:
  NEXUS: https://artifacts.itemis.cloud/repository/maven-mps

jobs:
  # the MPS zip is the same for every OS: downloaded once per version and shared by all smoke jobs
  prepare:
    name: MPS ${{ matrix.mps }} zip
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        mps: ['2022.2.4', '2026.1']
    steps:
      - name: Look up cached MPS zip
        id: lookup
        uses: actions/cache/restore@v4
        with:
          path: mps-cache/downloads/com/jetbrains/mps/${{ matrix.mps }}
          key: mps-zip-${{ matrix.mps }}
          enableCrossOsArchive: true
          lookup-only: true

      - name: Download MPS zip
        if: steps.lookup.outputs.cache-hit != 'true'
        run: |
          path="com/jetbrains/mps/${{ matrix.mps }}/mps-${{ matrix.mps }}.zip"
          mkdir -p "mps-cache/downloads/$(dirname "$path")"
          curl -fsSL --retry 3 -o "mps-cache/downloads/$path" "$NEXUS/$path"
          echo "$(curl -fsSL --retry 3 "$NEXUS/$path.sha1" | cut -c1-40)  mps-cache/downloads/$path" | sha1sum -c

      - name: Save MPS zip
        if: steps.lookup.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: mps-cache/downloads/com/jetbrains/mps/${{ matrix.mps }}
          key: mps-zip-${{ matrix.mps }}
          enableCrossOsArchive: true

  smoke:
    name: MPS ${{ matrix.mps }} on ${{ matrix.os }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        mps: ['2022.2.4', '2026.1']
        include:
          - mps: '2022.2.4'
            project: smoke-test/mps-2022.2
          - mps: '2026.1'
            project: smoke-test/mps-2026.1
    steps:
      - uses: actions/checkout@v5

      # the runner context is not available in job-level env
      - name: Set cache and work folders
        shell: bash
        run: |
          echo "MPS_ENV_GEN_CACHE=${{ github.workspace }}/mps-cache" >> "$GITHUB_ENV"
          echo "SMOKE_WORK=${{ runner.temp }}/smoke" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build the CLI
        run: ./gradlew :cli:installDist --stacktrace

      # prepared distributions are rebuilt from the cached archives in every job
      - name: Restore MPS zip
        uses: actions/cache/restore@v4
        with:
          path: mps-cache/downloads/com/jetbrains/mps/${{ matrix.mps }}
          key: mps-zip-${{ matrix.mps }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true

      - name: Cache JBR
        uses: actions/cache@v4
        with:
          path: mps-cache/downloads/com/jetbrains/jdk
          key: jbr-${{ runner.os }}-${{ runner.arch }}-${{ matrix.mps }}

      - name: Install X virtual framebuffer and ImageMagick (screenshots)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q xvfb imagemagick libxtst6 libxrender1 libxi6 fontconfig

      - name: Start MPS (Linux, macOS)
        if: runner.os != 'Windows'
        run: smoke-test/smoke.sh "${{ matrix.mps }}" "${{ matrix.project }}"

      - name: Start MPS (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: smoke-test/smoke.ps1 "${{ matrix.mps }}" "${{ matrix.project }}"

      - name: Upload start output and idea.log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ matrix.os }}-${{ matrix.mps }}
          path: |
            ${{ runner.temp }}/smoke/start-output.txt
            ${{ runner.temp }}/smoke/start-error.txt
            ${{ runner.temp }}/smoke/idea.log
            ${{ runner.temp }}/smoke/screenshot.png
          if-no-files-found: ignore
