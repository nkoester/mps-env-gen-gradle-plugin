name: Release

# Release:  tag v<MAJOR.MINOR.PATCH> (e.g. v0.2.0)          -> itemis Nexus (maven-mps-releases), GitHub Packages, GitHub release
# Snapshot: tag v<MAJOR.MINOR.PATCH>-SNAPSHOT (e.g. v0.2.0-SNAPSHOT) -> itemis Nexus (maven-mps-snapshots), GitHub Packages
# Both Maven repositories always hold the same versions.
# The leading v is optional. No pre-releases.
on:
  push:
    tags:
      - 'v[0-9]*'
      - '[0-9]*'

# never two releases of the same tag at once
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write   # GitHub release
  packages: write   # GitHub Packages

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # secrets are not available in step conditions
      HAS_ITEMIS_CLOUD: ${{ secrets.ARTIFACTS_ITEMIS_CLOUD_USER != '' }}

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          # releases always build from scratch
          cache-read-only: true

      # published versions cannot be deleted from the itemis Nexus; the build checks this again before publishing
      - name: Check tag and use it as version
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-SNAPSHOT)?$ ]]; then
            echo "::error::Tag $GITHUB_REF_NAME is neither v<MAJOR.MINOR.PATCH> nor v<MAJOR.MINOR.PATCH>-SNAPSHOT"
            exit 1
          fi
          # GitHub Packages and the itemis Nexus must hold the same versions
          if [[ "$HAS_ITEMIS_CLOUD" != true ]]; then
            echo "::error::Secrets ARTIFACTS_ITEMIS_CLOUD_USER/PW are missing"
            exit 1
          fi
          snapshot=false
          [[ "$version" == *-SNAPSHOT ]] && snapshot=true
          echo "$version" > version.txt
          echo "snapshot=$snapshot" >> "$GITHUB_OUTPUT"

      # build + tests of all modules, Maven artifacts in build/release/maven, CLI (JVM zip, jar) in build/release/cli;
      # the native CLI is a local option only (installNativeCli)
      - name: Build, test and package
        run: ./gradlew packageAll -PskipNative=true --stacktrace

      - name: Publish to GitHub Packages
        env:
          ORG_GRADLE_PROJECT_gitHubPackagesUsername: ${{ github.actor }}
          ORG_GRADLE_PROJECT_gitHubPackagesPassword: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          ./gradlew --stacktrace
          :core:publishAllPublicationsToGitHubPackagesRepository
          :gradle-plugin:publishAllPublicationsToGitHubPackagesRepository

      # Gradle plugin (with marker and core) only; after GitHub Packages, whose versions can be deleted if this fails
      - name: Publish to itemis Nexus
        env:
          ARTIFACTS_ITEMIS_CLOUD_USER: ${{ secrets.ARTIFACTS_ITEMIS_CLOUD_USER }}
          ARTIFACTS_ITEMIS_CLOUD_PW: ${{ secrets.ARTIFACTS_ITEMIS_CLOUD_PW }}
        run: >-
          ./gradlew --stacktrace
          :core:publishAllPublicationsToItemisCloudRepository
          :gradle-plugin:publishAllPublicationsToItemisCloudRepository

      - name: Create GitHub release
        if: steps.version.outputs.snapshot == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/release/cli/* --verify-tag --title "$GITHUB_REF_NAME" --generate-notes

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: modules/*/build/reports/tests/
