name: Release

# Tag v<version> or <version> (e.g. v0.2.0, 0.2.0-rc1); a tag with a qualifier becomes a pre-release
on:
  push:
    tags:
      - 'v[0-9]*'
      - '[0-9]*'

permissions:
  contents: write   # GitHub release
  packages: write   # GitHub Packages

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          # releases always build from scratch
          cache-read-only: true

      - name: Use tag as version
        run: echo "${GITHUB_REF_NAME#v}" > version.txt

      # build + tests of all modules, Maven artifacts in build/release/maven, CLI (JVM zip, jar) in build/release/cli;
      # the native CLI is a local option only (installNativeCli)
      - name: Build, test and package
        run: ./gradlew packageAll -PciBuild=true -PskipNative=true --stacktrace

      - name: Publish to GitHub Packages
        env:
          ORG_GRADLE_PROJECT_gitHubPackagesUsername: ${{ github.actor }}
          ORG_GRADLE_PROJECT_gitHubPackagesPassword: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          ./gradlew -PciBuild=true --stacktrace
          :core:publishAllPublicationsToGitHubPackagesRepository
          :gradle-plugin:publishAllPublicationsToGitHubPackagesRepository

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          [[ "$GITHUB_REF_NAME" == *-* ]] && prerelease="--prerelease"
          gh release create "$GITHUB_REF_NAME" build/release/cli/* --title "$GITHUB_REF_NAME" --generate-notes $prerelease

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: modules/*/build/reports/tests/
